name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Validate the catalog
        run: uv run scripts/check.py

      # The browser runtime behavior tests need Xvfb, x11vnc, websockify, and
      # /usr/share/novnc. The default channel also needs system Chrome at
      # /usr/bin/google-chrome. AGENT_TOOLS_BROWSER_CHANNEL=chromium needs
      # Playwright's bundled Chromium (`playwright install chromium`).
      # ubuntu-latest does not provide that stack. This job stays on the
      # catalog check and the checker tests so it remains green. The smoke
      # job below builds the container. Run the runtime tests locally with:
      #   uv run --project runtimes/browser --with pytest pytest runtimes/browser/tests -q
      - name: Test the checker
        run: uv run --with pytest --with pyyaml --with jsonschema pytest -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Smoke-test the browser image
        run: uv run --project runtimes/browser python runtimes/browser/contrib/smoke_container.py --engine docker
