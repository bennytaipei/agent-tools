[project]
name = "agent-tools-browser"
version = "1.0.0"
description = "Reference MCP runtime for the catalog browser tools."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "playwright>=1.49",
    "jsonschema>=4.23",
    "pyyaml>=6",
]

[project.scripts]
agent-tools-browser = "agent_tools_browser.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_tools_browser"]
