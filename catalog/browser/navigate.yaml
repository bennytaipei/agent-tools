name: navigate
when_to_use: Go to a URL in the remote browser.
inputs:
  type: object
  additionalProperties: false
  required:
    - url
  properties:
    url:
      type: string
      format: uri
      description: Absolute URL to open.
outputs:
  type: object
  additionalProperties: false
  required:
    - url
  properties:
    url:
      type: string
      format: uri
      description: URL of the page after navigation, including redirects.
side_effects: Loads the URL in the shared remote browser and replaces the current page.
auth_needed:
  - browser_session
