name: browser.scroll
version: 1.2.0
when_to_use: 'Scroll the page or a container. dx and dy move the nearest scrollable ancestor at target. scroll_y or y is an absolute page offset. delta is {dx, dy} or a number down. to is top, bottom, left, or right. read gives viewport pixel coordinates for point targets. Example: {"dx":600,"target":{"x":756,"y":425}}.'
inputs:
  type: object
  additionalProperties: false
  description: dx and dy scroll a container. scroll_y or y scrolls the page to an absolute offset. A bare number is accepted by the server as scroll_y.
  properties:
    target:
      type: object
      additionalProperties: false
      description: One locator key or a point. Precedence is placeholder, label, role, text, css, then x and y. nth and exact refine a locator. read gives viewport pixel coordinates for x and y.
      properties:
        placeholder:
          type: string
          minLength: 1
          description: Placeholder text for get_by_placeholder.
        label:
          type: string
          minLength: 1
          description: Label text for get_by_label.
        role:
          type: string
          minLength: 1
          description: ARIA role for get_by_role.
        name:
          type: string
          minLength: 1
          description: Accessible name for get_by_role.
        text:
          type: string
          minLength: 1
          description: Text for get_by_text.
        exact:
          type: boolean
          description: When true, text matches the whole string.
        css:
          type: string
          minLength: 1
          description: CSS selector.
        nth:
          type: integer
          minimum: 0
          description: Zero-based match in the winning frame.
        x:
          type: number
          description: Horizontal viewport CSS pixel from read.
        y:
          type: number
          description: Vertical viewport CSS pixel from read.
        scroll_y:
          type: integer
          minimum: 0
          description: Scroll the page to this offset before using x and y.
    dx:
      type: number
      description: Horizontal delta in CSS pixels. Positive moves toward the right edge.
    dy:
      type: number
      description: Vertical delta in CSS pixels. Positive moves down.
    scroll_y:
      type: integer
      minimum: 0
      description: Scroll the page to this absolute offset in CSS pixels.
    y:
      type: integer
      minimum: 0
      description: Same as scroll_y. Absolute page offset in CSS pixels. Not a point coordinate.
    delta:
      type: object
      additionalProperties: false
      description: Relative scroll in CSS pixels. The server also accepts a number as dy.
      properties:
        dx:
          type: number
          description: Horizontal scroll delta in CSS pixels.
        dy:
          type: number
          description: Vertical scroll delta in CSS pixels.
    to:
      type: string
      enum:
        - top
        - bottom
        - left
        - right
      description: Scroll to an edge of the page or the target container.
outputs:
  type: object
  additionalProperties: false
  required:
    - url
    - title
    - scroll_y
    - viewport
    - image
  properties:
    url:
      type: string
      format: uri
      description: URL of the page after scrolling.
    title:
      type: string
      description: Document title after scrolling.
    scroll_y:
      type: integer
      minimum: 0
      description: Scroll offset of the scroller that moved, in CSS pixels.
    viewport:
      type: object
      additionalProperties: false
      description: Viewport size in CSS pixels.
      required:
        - width
        - height
      properties:
        width:
          type: integer
          minimum: 1
          description: Viewport width in CSS pixels.
        height:
          type: integer
          minimum: 1
          description: Viewport height in CSS pixels.
    image:
      type: string
      contentMediaType: image/png
      contentEncoding: base64
      description: PNG screenshot of the viewport after scrolling.
    scrolled:
      type: object
      additionalProperties: false
      description: What moved. moved is false when the call succeeded but nothing could scroll.
      required:
        - element
        - frame
        - scroll_left
        - scroll_top
        - moved
        - max_scroll_left
        - max_scroll_top
      properties:
        element:
          type: string
          description: Tag, id, and class summary of the scroller.
        frame:
          type: string
          description: main, or the frame URL.
        scroll_left:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
          description: scrollLeft before and after.
        scroll_top:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
          description: scrollTop before and after.
        moved:
          type: boolean
          description: True when scrollLeft or scrollTop changed.
        max_scroll_left:
          type: number
          description: Maximum scrollLeft of the scroller.
        max_scroll_top:
          type: number
          description: Maximum scrollTop of the scroller.
        note:
          type: string
          description: Why nothing moved, when moved is false.
side_effects: Scrolls the page or the target container in the remote browser.
errors:
  - code: not_found
    when: The locator matched no element.
  - code: ambiguous
    when: The locator matched more than one element and nth was not set.
  - code: not_interactable
    when: The element is present and cannot be scrolled.
  - code: timeout
    when: The scroll did not finish before its timeout.
  - code: invalid_target
    when: The target or the other inputs do not describe a scroll this tool can perform.
  - code: no_session
    when: The remote browser has no page.
auth_needed:
  - browser_session
