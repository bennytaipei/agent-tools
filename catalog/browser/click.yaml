name: browser.click
version: 1.0.0
when_to_use: Click an element on the current page. target is a locator or a point in viewport CSS pixels from a browser.read screenshot.
inputs:
  type: object
  additionalProperties: false
  required:
    - target
  properties:
    target:
      description: Element to click. A locator, or a point in viewport CSS pixels.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - role
          properties:
            role:
              type: string
              minLength: 1
              description: ARIA role for Playwright get_by_role.
            name:
              type: string
              minLength: 1
              description: Accessible name for get_by_role.
            nth:
              type: integer
              minimum: 0
              description: Zero-based match when the locator matches more than one element.
        - type: object
          additionalProperties: false
          required:
            - text
          properties:
            text:
              type: string
              minLength: 1
              description: Text for Playwright get_by_text.
            exact:
              type: boolean
              description: When true, get_by_text matches the whole string.
            nth:
              type: integer
              minimum: 0
              description: Zero-based match when the locator matches more than one element.
        - type: object
          additionalProperties: false
          required:
            - css
          properties:
            css:
              type: string
              minLength: 1
              description: CSS selector for Playwright locator.
            nth:
              type: integer
              minimum: 0
              description: Zero-based match when the locator matches more than one element.
        - type: object
          additionalProperties: false
          required:
            - x
            - y
          properties:
            x:
              type: number
              description: Horizontal viewport CSS pixel.
            y:
              type: number
              description: Vertical viewport CSS pixel.
            scroll_y:
              type: integer
              minimum: 0
              description: Scroll the page to this offset before using x and y. Matches browser.read viewport scroll_y.
    button:
      type: string
      enum:
        - left
        - right
        - middle
      default: left
      description: Mouse button.
    click_count:
      type: integer
      minimum: 1
      maximum: 10
      default: 1
      description: Number of clicks.
    modifiers:
      type: array
      description: Modifier keys held during the click.
      items:
        type: string
        enum:
          - Alt
          - Control
          - Meta
          - Shift
          - ControlOrMeta
outputs:
  type: object
  additionalProperties: false
  required:
    - url
    - title
    - scroll_y
    - viewport
    - image
  properties:
    url:
      type: string
      format: uri
      description: URL of the page after the click.
    title:
      type: string
      description: Document title after the click.
    scroll_y:
      type: integer
      minimum: 0
      description: Scroll offset of the page after the click, in CSS pixels.
    viewport:
      type: object
      additionalProperties: false
      description: Viewport size in CSS pixels.
      required:
        - width
        - height
      properties:
        width:
          type: integer
          minimum: 1
          description: Viewport width in CSS pixels.
        height:
          type: integer
          minimum: 1
          description: Viewport height in CSS pixels.
    image:
      type: string
      contentMediaType: image/png
      contentEncoding: base64
      description: PNG screenshot of the viewport after the click.
side_effects: Clicks the target in the remote browser.
errors:
  - code: not_found
    when: The locator matched no element.
  - code: ambiguous
    when: The locator matched more than one element and nth was not set.
  - code: not_interactable
    when: The element is present and cannot be clicked.
  - code: timeout
    when: The click did not finish before its timeout.
  - code: invalid_target
    when: The target or the other inputs do not describe a click this tool can perform.
  - code: no_session
    when: The remote browser has no page.
auth_needed:
  - browser_session
