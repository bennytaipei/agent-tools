name: browser.screenshot
version: 1.0.0
when_to_use: 'Capture the current viewport as one PNG. This tool takes no input fields. Example: {}.'
inputs:
  type: object
  additionalProperties: false
  properties: {}
outputs:
  type: object
  additionalProperties: false
  required:
    - image
  properties:
    image:
      type: string
      contentMediaType: image/png
      contentEncoding: base64
      description: PNG screenshot of the current page.
side_effects: None. Does not navigate, click, or change the page.
errors:
  - code: no_page
    when: The remote browser has no current page to capture.
auth_needed:
  - browser_session
