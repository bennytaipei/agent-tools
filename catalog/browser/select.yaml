name: browser.select
version: 1.0.0
when_to_use: Choose an option in a select element on the current page. Pass one of value, label, or index.
inputs:
  type: object
  additionalProperties: false
  properties:
    target:
      description: The select element. A locator, or a point in viewport CSS pixels.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - role
          properties:
            role:
              type: string
              minLength: 1
              description: ARIA role for Playwright get_by_role.
            name:
              type: string
              minLength: 1
              description: Accessible name for get_by_role.
            nth:
              type: integer
              minimum: 0
              description: Zero-based match when the locator matches more than one element.
        - type: object
          additionalProperties: false
          required:
            - text
          properties:
            text:
              type: string
              minLength: 1
              description: Text for Playwright get_by_text.
            exact:
              type: boolean
              description: When true, get_by_text matches the whole string.
            nth:
              type: integer
              minimum: 0
              description: Zero-based match when the locator matches more than one element.
        - type: object
          additionalProperties: false
          required:
            - css
          properties:
            css:
              type: string
              minLength: 1
              description: CSS selector for Playwright locator.
            nth:
              type: integer
              minimum: 0
              description: Zero-based match when the locator matches more than one element.
        - type: object
          additionalProperties: false
          required:
            - x
            - y
          properties:
            x:
              type: number
              description: Horizontal viewport CSS pixel.
            y:
              type: number
              description: Vertical viewport CSS pixel.
            scroll_y:
              type: integer
              minimum: 0
              description: Scroll the page to this offset before using x and y. Matches browser.read viewport scroll_y.
    value:
      type: string
      minLength: 1
      description: Option value to select.
    label:
      type: string
      minLength: 1
      description: Option label to select.
    index:
      type: integer
      minimum: 0
      description: Zero-based option index to select.
  oneOf:
    - required:
        - target
        - value
      properties:
        label: false
        index: false
    - required:
        - target
        - label
      properties:
        value: false
        index: false
    - required:
        - target
        - index
      properties:
        value: false
        label: false
outputs:
  type: object
  additionalProperties: false
  required:
    - url
    - title
    - scroll_y
    - viewport
    - image
  properties:
    url:
      type: string
      format: uri
      description: URL of the page after the selection.
    title:
      type: string
      description: Document title after the selection.
    scroll_y:
      type: integer
      minimum: 0
      description: Scroll offset of the page after the selection, in CSS pixels.
    viewport:
      type: object
      additionalProperties: false
      description: Viewport size in CSS pixels.
      required:
        - width
        - height
      properties:
        width:
          type: integer
          minimum: 1
          description: Viewport width in CSS pixels.
        height:
          type: integer
          minimum: 1
          description: Viewport height in CSS pixels.
    image:
      type: string
      contentMediaType: image/png
      contentEncoding: base64
      description: PNG screenshot of the viewport after the selection.
side_effects: Selects an option on a select element in the remote browser.
errors:
  - code: not_found
    when: The locator matched no element, or the option is not in the select.
  - code: ambiguous
    when: The locator matched more than one element and nth was not set.
  - code: not_interactable
    when: The select is present and cannot be changed.
  - code: timeout
    when: The selection did not finish before its timeout.
  - code: invalid_target
    when: The target is not a select element, or the inputs do not name one option.
  - code: no_session
    when: The remote browser has no page.
auth_needed:
  - browser_session
