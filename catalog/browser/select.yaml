name: browser.select
version: 1.2.0
when_to_use: 'Choose an option in a select element. target is a locator or a point.
  Pass one of value, label, or index. Example: {"target":{"css":"select"},"label":"Green"}.'
inputs:
  type: object
  additionalProperties: false
  required:
  - target
  description: target plus exactly one of value, label, or index. value wins if more
    than one is set.
  properties:
    target:
      type: object
      additionalProperties: false
      description: One locator key or a point. Precedence is placeholder, label, role,
        text, css, then x and y. nth and exact refine a locator. read gives viewport
        pixel coordinates for x and y.
      properties:
        placeholder:
          type: string
          minLength: 1
          description: Placeholder text for get_by_placeholder.
        label:
          type: string
          minLength: 1
          description: Label text for get_by_label.
        role:
          type: string
          minLength: 1
          description: ARIA role for get_by_role.
        name:
          type: string
          minLength: 1
          description: Accessible name for get_by_role.
        text:
          type: string
          minLength: 1
          description: Text for get_by_text.
        exact:
          type: boolean
          description: When true, text matches the whole string.
        css:
          type: string
          minLength: 1
          description: CSS selector.
        nth:
          type: integer
          minimum: 0
          description: Zero-based match in the winning frame.
        x:
          type: number
          description: Horizontal viewport CSS pixel from read.
        y:
          type: number
          description: Vertical viewport CSS pixel from read.
        scroll_y:
          type: integer
          minimum: 0
          description: Scroll the page to this offset before using x and y.
    value:
      type: string
      minLength: 1
      description: Option value to select.
    label:
      type: string
      minLength: 1
      description: Option label to select.
    index:
      type: integer
      minimum: 0
      description: Zero-based option index to select.
outputs:
  type: object
  additionalProperties: false
  required:
  - url
  - title
  - scroll_y
  - viewport
  - image
  properties:
    url:
      type: string
      format: uri
      description: URL of the page after the selection.
    title:
      type: string
      description: Document title after the selection.
    scroll_y:
      type: integer
      minimum: 0
      description: Scroll offset of the page after the selection, in CSS pixels.
    viewport:
      type: object
      additionalProperties: false
      description: Viewport size in CSS pixels.
      required:
      - width
      - height
      properties:
        width:
          type: integer
          minimum: 1
          description: Viewport width in CSS pixels.
        height:
          type: integer
          minimum: 1
          description: Viewport height in CSS pixels.
    image:
      type: string
      contentMediaType: image/png
      contentEncoding: base64
      description: PNG screenshot of the viewport after the selection.
side_effects: Selects an option on a select element in the remote browser.
errors:
- code: not_found
  when: The locator matched no element, or the option is not in the select.
- code: ambiguous
  when: The locator matched more than one element and nth was not set.
- code: not_interactable
  when: The select is present and cannot be changed.
- code: timeout
  when: The selection did not finish before its timeout.
- code: invalid_target
  when: The target is not a select element, or the inputs do not name one option.
- code: no_session
  when: The remote browser has no page.
auth_needed:
- browser_session
