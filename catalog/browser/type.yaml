name: browser.type
version: 1.2.0
when_to_use: 'Type text into an element on the current page. text is the characters.
  target is optional. clear replaces the current text. press_enter presses Enter after
  typing. Example: {"target":{"label":"Email"},"text":"ada@example.com","clear":true}.'
inputs:
  type: object
  additionalProperties: false
  required:
  - text
  description: text is required. target is optional and uses the same locator keys
    as click.
  properties:
    target:
      type: object
      additionalProperties: false
      description: One locator key or a point. Precedence is placeholder, label, role,
        text, css, then x and y. nth and exact refine a locator. read gives viewport
        pixel coordinates for x and y.
      properties:
        placeholder:
          type: string
          minLength: 1
          description: Placeholder text for get_by_placeholder.
        label:
          type: string
          minLength: 1
          description: Label text for get_by_label.
        role:
          type: string
          minLength: 1
          description: ARIA role for get_by_role.
        name:
          type: string
          minLength: 1
          description: Accessible name for get_by_role.
        text:
          type: string
          minLength: 1
          description: Text for get_by_text.
        exact:
          type: boolean
          description: When true, text matches the whole string.
        css:
          type: string
          minLength: 1
          description: CSS selector.
        nth:
          type: integer
          minimum: 0
          description: Zero-based match in the winning frame.
        x:
          type: number
          description: Horizontal viewport CSS pixel from read.
        y:
          type: number
          description: Vertical viewport CSS pixel from read.
        scroll_y:
          type: integer
          minimum: 0
          description: Scroll the page to this offset before using x and y.
    text:
      type: string
      description: Text to type.
    clear:
      type: boolean
      default: false
      description: When true, replace the element's current text.
    press_enter:
      type: boolean
      default: false
      description: When true, press Enter after typing.
outputs:
  type: object
  additionalProperties: false
  required:
  - url
  - title
  - scroll_y
  - viewport
  - image
  properties:
    url:
      type: string
      format: uri
      description: URL of the page after typing.
    title:
      type: string
      description: Document title after typing.
    scroll_y:
      type: integer
      minimum: 0
      description: Scroll offset of the page after typing, in CSS pixels.
    viewport:
      type: object
      additionalProperties: false
      description: Viewport size in CSS pixels.
      required:
      - width
      - height
      properties:
        width:
          type: integer
          minimum: 1
          description: Viewport width in CSS pixels.
        height:
          type: integer
          minimum: 1
          description: Viewport height in CSS pixels.
    image:
      type: string
      contentMediaType: image/png
      contentEncoding: base64
      description: PNG screenshot of the viewport after typing.
    typed:
      type: object
      additionalProperties: false
      required:
      - value
      - matched_text
      description: The field after typing.
      properties:
        value:
          type: string
          description: Final field value, truncated to 200 characters.
        matched_text:
          type: boolean
          description: True when the field equals text, or ends with text when clear
            is false.
        events:
          type: array
          items:
            type: string
          description: input, change, or keydown events observed while typing.
    note:
      type: string
      description: Set when the field contains more than the text just sent. Send
        clear true to replace.
side_effects: Types text into the target, or into the focused element when target
  is omitted. Clears that text first when clear is true. Presses Enter when press_enter
  is true.
errors:
- code: not_found
  when: The locator matched no element.
- code: ambiguous
  when: The locator matched more than one element and nth was not set.
- code: not_interactable
  when: The element is present and cannot be typed into, or no editable element is
    focused.
- code: timeout
  when: Typing did not finish before its timeout.
- code: invalid_target
  when: The target or the other inputs do not describe typing this tool can perform.
- code: no_session
  when: The remote browser has no page.
auth_needed:
- browser_session
