name: browser.wait_for
version: 1.2.0
when_to_use: 'Wait until the current page matches. Pass target and state, or text,
  or url_matches, or load_state. timeout_ms is milliseconds, default 10000. Example:
  {"target":{"text":"Ready"},"state":"visible"}.'
inputs:
  type: object
  additionalProperties: false
  description: One of target plus state, text, url_matches, or load_state. timeout_ms
    is optional.
  properties:
    target:
      additionalProperties: false
      description: Locator to wait for, with state. Precedence is placeholder, label,
        role, text, then css. A point is not a wait target.
      properties:
        css:
          description: CSS selector.
          minLength: 1
          type: string
        exact:
          description: When true, text matches the whole string.
          type: boolean
        label:
          description: Label text for get_by_label.
          minLength: 1
          type: string
        name:
          description: Accessible name for get_by_role.
          minLength: 1
          type: string
        nth:
          description: Zero-based match in the winning frame.
          minimum: 0
          type: integer
        placeholder:
          description: Placeholder text for get_by_placeholder.
          minLength: 1
          type: string
        role:
          description: ARIA role for get_by_role.
          minLength: 1
          type: string
        scroll_y:
          description: Scroll the page to this offset before using x and y.
          minimum: 0
          type: integer
        text:
          description: Text for get_by_text.
          minLength: 1
          type: string
        x:
          description: Horizontal viewport CSS pixel from read.
          type: number
        y:
          description: Vertical viewport CSS pixel from read.
          type: number
      type: object
    state:
      type: string
      enum:
      - visible
      - hidden
      description: Wait until the locator is visible or hidden.
    text:
      type: string
      minLength: 1
      description: Wait until this text is present.
    url_matches:
      type: string
      minLength: 1
      description: Regular expression matched against the page URL.
    load_state:
      type: string
      enum:
      - load
      - domcontentloaded
      - networkidle
      description: Playwright load state to wait for.
    timeout_ms:
      type: integer
      minimum: 0
      maximum: 120000
      default: 10000
      description: How long to wait, in milliseconds. Defaults to 10000.
outputs:
  type: object
  additionalProperties: false
  required:
  - url
  - title
  - scroll_y
  - viewport
  - image
  properties:
    url:
      type: string
      format: uri
      description: URL of the page when the wait ends.
    title:
      type: string
      description: Document title when the wait ends.
    scroll_y:
      type: integer
      minimum: 0
      description: Scroll offset of the page when the wait ends, in CSS pixels.
    viewport:
      type: object
      additionalProperties: false
      description: Viewport size in CSS pixels.
      required:
      - width
      - height
      properties:
        width:
          type: integer
          minimum: 1
          description: Viewport width in CSS pixels.
        height:
          type: integer
          minimum: 1
          description: Viewport height in CSS pixels.
    image:
      type: string
      contentMediaType: image/png
      contentEncoding: base64
      description: PNG screenshot of the viewport when the wait ends.
side_effects: None. Waits until the page matches the requested condition or the timeout
  elapses. Does not navigate, click, or type.
errors:
- code: not_found
  when: The locator matched no element when the wait required one to exist already.
- code: ambiguous
  when: The locator matched more than one element and nth was not set.
- code: not_interactable
  when: The element is present and its visibility cannot be read.
- code: timeout
  when: The condition was not met before timeout_ms elapsed.
- code: invalid_target
  when: The inputs do not describe one wait this tool can perform.
- code: no_session
  when: The remote browser has no page.
auth_needed:
- browser_session
